<style>
:root{
  --bg:#F7F6F2; --card:#FFFFFF; --ink:#1C2A27; --muted:#5A6965; --line:#D8DFDC;
  --acc:#1B6E62; --acc-ink:#FFFFFF; --soft:#E3F0EC; --err:#A3361F; --track:#ECEFED;

}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1A18; --card:#17241F; --ink:#E7EEEB; --muted:#9FB1AB; --line:#2A3A35; --acc:#3FA593; --acc-ink:#06201B; --soft:#1B3029; --err:#F08C74; --track:#22322D}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}
header{padding:28px 0 6px}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1{font:600 32px/1.12 var(--serif);margin:8px 0 2px}
h2{font:600 20px/1.2 var(--serif);margin:0}
.muted{color:var(--muted)}
.fecha{color:var(--muted);margin:0 0 14px}
.seg{display:inline-flex;background:var(--track);border-radius:999px;padding:3px;margin:0 0 14px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--sans);padding:8px 18px;border-radius:999px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.cab{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}
.cnt{font:600 14px var(--sans);color:var(--muted)}
.hab{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:14px;padding:12px 14px;margin:0 0 8px;font:inherit;cursor:pointer;min-height:56px}
.hab .em{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--acc);display:grid;place-items:center}
.hab .em svg{width:24px;height:24px}
.hab[aria-pressed="true"] .em{background:var(--acc);color:var(--acc-ink)}
.hab .tx{flex:1;min-width:0}
.hab b{display:block;font-weight:600;line-height:1.3}
.hab small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.hab .ok{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.hab[aria-pressed="true"]{background:var(--soft);border-color:var(--acc)}
.hab[aria-pressed="true"] .ok{background:var(--acc);border-color:var(--acc)}
.hab[aria-pressed="true"] .ok::after{content:"";width:10px;height:6px;border:solid var(--acc-ink);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.hab:disabled{opacity:.6}
.vacio{color:var(--muted);margin:4px 0}
.sem{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{text-align:center;font-size:12px;color:var(--muted)}
.dia .bar{height:56px;border-radius:8px;background:var(--track);margin:6px 0 4px;position:relative;overflow:hidden}
.dia .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--acc);border-radius:8px}
.dia.hoy{color:var(--ink);font-weight:700}
.dia.fut .bar{opacity:.4}
.rut{list-style:none;margin:0 0 14px;padding:0}
.rut li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.3}
.rut li:first-child{border-top:0}
.rut .hr{flex:none;min-width:46px;max-width:80px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums}
.rut .ic{flex:none;width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--acc);display:grid;place-items:center}
.rut .ic svg{width:18px;height:18px}
.sub{font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
.q{margin:14px 0 0}
.q .t{display:block;font-weight:600;margin:0 0 6px}
.q .t small{font-weight:400;color:var(--muted);font-size:13px}
.op{display:grid;gap:6px}
.op.c2{grid-template-columns:repeat(2,1fr)}.op.c3{grid-template-columns:repeat(3,1fr)}.op.c5{grid-template-columns:repeat(5,1fr)}.op.c6{grid-template-columns:repeat(6,1fr)}
.op button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px var(--sans);border-radius:10px;min-height:44px;padding:6px 4px;cursor:pointer}
.op button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.op button.ancho{grid-column:1/-1}
.campo{width:100%;font:16px var(--sans);padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:8px 0 0}
.cierre .btn{width:100%;margin-top:14px}
.btn:disabled{opacity:.45;cursor:default}
.ok-msg{color:var(--acc)}
.af{display:flex;gap:14px;align-items:center}
.anillo{flex:none;width:84px;height:84px}
.ai b{display:block;font-weight:600}.ai small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.ayuno .btn{width:100%;margin-top:12px}
.enlace{border:0;background:none;color:var(--acc);font:600 14px var(--sans);padding:10px 0 0;cursor:pointer}
.msg{min-height:22px;font-size:14px;color:var(--err);margin:4px 0 0}
.entrar input{width:100%;font:16px var(--sans);padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:10px 0}
.btn{border:0;background:var(--acc);color:var(--acc-ink);font:600 16px var(--sans);padding:12px 18px;border-radius:12px;cursor:pointer;min-height:44px}
</style>
</head>

function icono(n){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','1.7');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');s.innerHTML=ICONOS[n]||ICONOS.check;return s}
var DK=['dom','lun','mar','mie','jue','vie','sab'],INI=['L','M','X','J','V','S','D'];
var token=null,E=null,dia=0; /* dia: 0 hoy, 1 ayer */
var $=function(id){return document.getElementById(id)};
function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
/* De madrugada (antes de las 05:00) todavía cuenta el día anterior. */
function base(){var d=new Date();if(d.getHours()<5)d.setDate(d.getDate()-1);d.setHours(12,0,0,0);return d}
function fechaSel(){var d=base();d.setDate(d.getDate()-dia);return d}
function lunes(d){var x=new Date(d);var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function larga(d){var s=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1)}
(function(){
  var t=null;try{t=new URLSearchParams(location.search).get('t')}catch(e){}
  try{if(t){localStorage.setItem(TKEY,t);history.replaceState(null,'',location.pathname)}else t=localStorage.getItem(TKEY)}catch(e){}
  token=t||null;
})();
function rpc(fn,args){
  return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.text()}).then(function(t){return t?JSON.parse(t):null});
}
function aplica(x,d){
  if(x.cuando==='diario')return true;
  if(x.cuando==='fechas')return (x.fechas||[]).indexOf(iso(d))>=0;
  if(x.cuando.indexOf('semanal:')===0)return false;
  return x.cuando.split(',').indexOf(DK[d.getDay()])>=0;
}
function semanal(x){return x.cuando.indexOf('semanal:')===0?parseInt(x.cuando.split(':')[1],10):0}
function hecho(f,id){for(var i=0;i<E.checks.length;i++){var k=E.checks[i];if(k.fecha===f&&k.habito_id===id)return !!k.hecho}return false}
function poner(f,id,v){for(var i=0;i<E.checks.length;i++){var k=E.checks[i];if(k.fecha===f&&k.habito_id===id){k.hecho=v;return}}E.checks.push({fecha:f,habito_id:id,hecho:v})}
function veces(x,d){var l=lunes(d),n=0;for(var i=0;i<7;i++){var y=new Date(l);y.setDate(l.getDate()+i);if(hecho(iso(y),x.id))n++}return n}

/* Reloj de ayuno, como el de Pulso Jugador: hora de la última comida (empieza) y de la primera (rompe). Sin borrar. */
var tick=null,editAyuno=false,horaTocada=false;
function hhmm(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function local(d){return iso(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}

  var horas=inicio?Math.max(0,(Date.now()-new Date(inicio))/36e5):0,p=Math.min(1,inicio?horas/meta:0),r=34,cf=2*Math.PI*r;

    (p>0?'<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(cf*p)+' '+cf+'" transform="rotate(-90 42 42)"/>':'')+

function tarjetaAyuno(){
  var c=h('section','card ayuno'),meta=E.ayuno_horas||12,inicio=E.ayuno_actual||null,cab=h('div','cab');
  cab.appendChild(h('h2',null,'Ayuno'));c.appendChild(cab);

  });

  clearInterval(tick);tick=setInterval(function(){if(!caja.isConnected){clearInterval(tick);return}anillo(caja,inicio,meta);if(!horaTocada&&!editAyuno)hora.value=hhmm()},30000);

function tarjetaCierre(f){
  var previo=null;(E.cierres||[]).forEach(function(x){if(x.fecha===f)previo=x});
  if(!FORM[f]){var o={molestia_zona:'',nota:''};preguntas().forEach(function(q){o[q[0]]=q[0]==='rpe'?undefined:null});
    if(previo){Object.keys(o).forEach(function(k){if(previo[k]!==undefined)o[k]=previo[k]});if(previo.rpe===null)o.rpe=null}
    FORM[f]=o}
  var F=FORM[f],c=h('section','card cierre'),cab=h('div','cab');
  cab.appendChild(h('h2',null,dia?'Cierre de ayer':'Cierre del día'));if(previo)cab.appendChild(h('span','cnt','Hecho'));c.appendChild(cab);
  c.appendChild(h('p','vacio','Antes de dormir.'));
  var btn=h('button','btn',previo?'Actualizar cierre':'Guardar cierre');btn.type='button';
  var completo=function(){return preguntas().every(function(q){return q[0]==='rpe'?F.rpe!==undefined:F[q[0]]!==null})};
  var zona=h('input','campo');zona.type='text';zona.maxLength=60;zona.placeholder='Zona (opcional)';zona.value=F.molestia_zona||'';zona.oninput=function(){F.molestia_zona=zona.value};
  var verZona=function(){zona.hidden=!(F.molestia==='leve'||F.molestia==='limita')};
  preguntas().forEach(function(q){
    var d=h('div','q'),t=h('span','t',q[1]);if(q[4]){t.appendChild(document.createTextNode(' '));t.appendChild(h('small',null,q[4]))}d.appendChild(t);
    var g=h('div','op '+q[2]);
    q[3].forEach(function(o){var b=h('button',(q[0]==='rpe'&&o[0]===null)?'ancho':null,o[1]);b.type='button';b.setAttribute('aria-pressed',F[q[0]]===o[0]?'true':'false');
      b.addEventListener('click',function(){F[q[0]]=o[0];Array.prototype.forEach.call(g.children,function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');verZona();btn.disabled=!completo()});
      g.appendChild(b)});
    d.appendChild(g);if(q[0]==='molestia'){verZona();d.appendChild(zona)}c.appendChild(d)});
  var nota=h('input','campo');nota.type='text';nota.maxLength=300;nota.placeholder='Algo que contar (opcional)';nota.value=F.nota||'';nota.oninput=function(){F.nota=nota.value};c.appendChild(nota);
  btn.disabled=!completo();
  btn.addEventListener('click',function(){
    btn.disabled=true;$('msg').textContent='';
    var datos={};Object.keys(F).forEach(function(k){datos[k]=F[k]});if(zona.hidden)datos.molestia_zona='';datos.molestia_zona=(datos.molestia_zona||'').trim();
    if(datos.rpe===undefined)datos.rpe=null;
    rpc('cli_guardar_cierre',{p_token:token,p_fecha:f,p_datos:datos}).then(function(){
      E.cierres=(E.cierres||[]).filter(function(x){return x.fecha!==f});var g2={fecha:f};Object.keys(datos).forEach(function(k){g2[k]=datos[k]});E.cierres.unshift(g2);
      delete FORM[f];pintar();var m=$('msg');m.className='msg ok-msg';m.textContent='Cierre guardado.';setTimeout(function(){if(m.textContent==='Cierre guardado.'){m.textContent='';m.className='msg'}},2500);
    }).catch(function(){btn.disabled=false;$('msg').className='msg';$('msg').textContent='No se ha podido guardar. Revisa la conexión y vuelve a intentarlo.'});
  });
  c.appendChild(btn);return c;
}

function pintar(){
  var d=fechaSel(),f=iso(d),v=$('vista');v.innerHTML='';
  $('titulo').textContent='Hola, '+E.nombre;$('fecha').textContent=larga(d);
  var seg=h('div','seg');['Hoy','Ayer'].forEach(function(t,i){var b=h('button',null,t);b.type='button';b.setAttribute('aria-pressed',dia===i?'true':'false');
    b.addEventListener('click',function(){dia=i;pintar()});seg.appendChild(b)});v.appendChild(seg);

  var hoy=E.habitos.filter(function(x){return aplica(x,d)});
  var c=h('section','card'),cab=h('div','cab');cab.appendChild(h('h2',null,dia?'Tus hábitos de ayer':'Tus hábitos de hoy'));
  cab.appendChild(h('span','cnt',hoy.filter(function(x){return hecho(f,x.id)}).length+' de '+hoy.length));c.appendChild(cab);
  if(!hoy.length)c.appendChild(h('p','vacio','Hoy no toca ninguno.'));
  hoy.forEach(function(x){c.appendChild(boton(x,f,x.linea))});v.appendChild(c);

  var sem=E.habitos.filter(semanal);
  if(sem.length){var s=h('section','card'),cs=h('div','cab');cs.appendChild(h('h2',null,'Esta semana'));s.appendChild(cs);
    sem.forEach(function(x){var n=semanal(x);s.appendChild(boton(x,f,veces(x,d)+' de '+n+(dia?' · marca si lo hiciste ayer':' · marca el día que lo hagas')))});v.appendChild(s)}

  v.appendChild(tarjetaAyuno());
  if(E.rutina&&E.rutina.length)v.appendChild(tarjetaRutina());
  v.appendChild(tarjetaCierre(f));

  var w=h('section','card'),cw=h('div','cab');cw.appendChild(h('h2',null,'Tu semana'));w.appendChild(cw);
  var g=h('div','sem'),l=lunes(d),hoyIso=iso(base());
  for(var i=0;i<7;i++){var y=new Date(l);y.setDate(l.getDate()+i);var fy=iso(y);
    var ap=E.habitos.filter(function(x){return aplica(x,y)}),hn=ap.filter(function(x){return hecho(fy,x.id)}).length;
    var col=h('div','dia'+(fy===hoyIso?' hoy':'')+(fy>hoyIso?' fut':''));col.appendChild(h('div',null,INI[i]));
    var bar=h('div','bar'),fill=h('i');fill.style.height=(ap.length?Math.round(hn/ap.length*100):0)+'%';bar.appendChild(fill);col.appendChild(bar);
    col.appendChild(h('div',null,ap.length?hn+'/'+ap.length:'·'));g.appendChild(col)}
  w.appendChild(g);v.appendChild(w);
}

function sinEnlace(txt){
  var v=$('vista');v.innerHTML='';$('titulo').textContent='Tu app';
  var c=h('section','card entrar');c.appendChild(h('p',null,txt||'Abre el enlace personal que te enviamos, o pégalo aquí.'));
  var inp=h('input');inp.type='url';inp.placeholder='Pega tu enlace';inp.autocomplete='off';c.appendChild(inp);
  var b=h('button','btn','Entrar');b.type='button';b.addEventListener('click',function(){var m=String(inp.value).match(/[?&]t=([0-9a-f]{32,})/i)||String(inp.value).trim().match(/^([0-9a-f]{32,})$/i);
    if(!m){$('msg').textContent='Ese enlace no es válido.';return}token=m[1];try{localStorage.setItem(TKEY,token)}catch(e){}$('msg').textContent='';cargar()});
  c.appendChild(b);v.appendChild(c);
}

function cargar(){
  if(!token){sinEnlace();return}
  rpc('cli_hoy',{p_token:token}).then(function(r){
    if(!r){try{localStorage.removeItem(TKEY)}catch(e){}token=null;sinEnlace('Este enlace ya no vale. Pega el nuevo que te enviemos.');return}
    E=r;E.checks=E.checks||[];E.habitos=E.habitos||[];E.cierres=E.cierres||[];E.rutina=E.rutina||[];E.ayunos=E.ayunos||[];pintar();
  }).catch(function(){$('vista').innerHTML='';$('msg').textContent='No se ha podido cargar. Revisa la conexión y vuelve a abrir la app.'});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&E)cargar()});
cargar();
</script>
</body>

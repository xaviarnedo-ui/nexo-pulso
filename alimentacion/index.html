*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}

h2{font:600 24px/1.2 var(--serif);margin:18px 0 6px;scroll-margin-top:16px}
p{margin:0 0 12px}
.muted{color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px 18px;margin:12px 0}
.prog{font-size:13px;color:var(--muted);margin-top:18px}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.fill{height:100%;background:var(--acc);transition:width .25s}
.q{margin:20px 0 0}
.q .t{display:block;font-weight:600;font-size:16px;margin-bottom:8px}
.q .t small{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{resize:vertical;min-height:76px}
input[type=text]{margin-top:8px}
.q>input[type=text]:first-child{margin-top:0}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.chips button,.col button{font:inherit;font-size:15px;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.col button{border-radius:12px}
.chips button[aria-pressed=true],.col button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.chips button[aria-pressed=true]::before,.col button[aria-pressed=true]::before{content:"✓ "}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--acc);background:transparent;color:var(--acc);font:600 16px var(--sans);cursor:pointer;text-decoration:none}
.btn.main{background:var(--acc);color:var(--acc-ink)}
.btn.quiet{border-color:var(--line);color:var(--muted)}
.btn.small{min-height:40px;font-size:14px;padding:0 14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.aviso{width:100%;justify-content:flex-start;text-align:left;padding:12px 16px;min-height:56px;font-weight:500;line-height:1.35;border-color:var(--line);color:var(--ink)}
.btn.aviso[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.falta{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0 0;max-height:380px;overflow:auto}
.msg{min-height:22px;font-size:14px;color:var(--acc);margin-top:10px}
.estado{font-size:14px;color:var(--acc);font-weight:600;margin:6px 0 0}
details>summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:40px;display:flex;align-items:center}
</style>
</head>

function rpc(fn,args){
  return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.text()}).then(function(t){return t?JSON.parse(t):null});
}
function cuando(iso){try{return new Date(iso).toLocaleString('es-ES',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function marca(iso){var b=$('estado-envio');b.textContent=iso?'Enviado el '+cuando(iso)+'.':'';b.hidden=!iso}

function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function respondida(p){
  var v=S.r[p.id];
  if(p.tipo==='multi')return Array.isArray(v)&&v.length>0&&(!p.otro||v.indexOf(p.otro)<0||(S.r[p.id+'_otro']||'').trim().length>0);
  if(p.tipo==='aviso')return v===true;
  if(p.tipo==='texto'||p.tipo==='linea')return (v||'').trim().length>0;
  return v!=null&&v!=='';
}
function faltan(P){return P.preguntas.filter(function(p){return p.req&&!respondida(p)})}
function texto(){
  var L=[],n=(S.r.nombre||'').trim();
  L.push('MIS PREFERENCIAS DE ALIMENTACIÓN'+(n?' · '+n:''));L.push('');
  PASOS.forEach(function(P){
    var r=[];
    P.preguntas.forEach(function(p){
      if(p.id==='nombre'||p.tipo==='aviso'||!respondida(p)&&p.tipo!=='texto')return;
      var v=S.r[p.id];
      if(p.tipo==='multi'){v=v.map(function(x){return p.otro&&x===p.otro?x+': '+(S.r[p.id+'_otro']||'').trim():x}).join(', ')}
      else if(p.tipo==='texto'){v=(v||'').trim();if(!v)return}
      r.push('- '+(p.o||p.t)+': '+v);
    });
    if(r.length){L.push(P.titulo.toUpperCase());r.forEach(function(x){L.push(x)});L.push('')}
  });
  if(S.r.acepto)L.push('Acepto que se usen estas respuestas solo para preparar mis pautas de alimentación.');
  return L.join('\n').trim();
}
function pregunta(P,p,onChange){
  var q=h('div','q');
  if(p.tipo==='aviso'){
    var b=h('button','btn aviso',p.t);b.type='button';b.setAttribute('aria-pressed',S.r[p.id]?'true':'false');

  }
  var t=h('span','t',p.t);t.id='q-'+p.id;
  if(p.ayuda){t.appendChild(document.createTextNode(' '));t.appendChild(h('small',null,p.ayuda))}
  q.appendChild(t);
  if(p.tipo==='texto'){
    var a=document.createElement('textarea');a.rows=2;a.maxLength=400;a.value=S.r[p.id]||'';a.setAttribute('aria-labelledby',t.id);
    a.addEventListener('input',function(){S.r[p.id]=a.value;onChange()});q.appendChild(a);
  }else if(p.tipo==='linea'){
    var i0=document.createElement('input');i0.type='text';i0.maxLength=80;i0.value=S.r[p.id]||'';i0.autocomplete='given-name';i0.setAttribute('aria-labelledby',t.id);
    i0.addEventListener('input',function(){S.r[p.id]=i0.value;onChange()});q.appendChild(i0);
  }else{
    var multi=p.tipo==='multi';
    var g=h('div',multi?'chips':'col');g.setAttribute('role','group');g.setAttribute('aria-labelledby',t.id);
    var otro=null,btns=[];
    var pinta=function(){
      var sel=multi?(S.r[p.id]||[]):S.r[p.id];
      btns.forEach(function(x){var on=multi?sel.indexOf(x.o)>=0:sel===x.o;x.b.setAttribute('aria-pressed',on?'true':'false')});
      if(otro)otro.hidden=!(multi&&sel.indexOf(p.otro)>=0);
    };
    p.opciones.forEach(function(o){
      var b=h('button',null,o);b.type='button';
      b.addEventListener('click',function(){
        if(!multi)S.r[p.id]=o;
        else{
          var cur=(S.r[p.id]||[]),on=cur.indexOf(o)>=0;
          if(o===p.excl)S.r[p.id]=on?[]:[o];
          else{var s=cur.filter(function(x){return x!==p.excl});S.r[p.id]=on?s.filter(function(x){return x!==o}):s.concat([o])}
        }
        pinta();onChange();
      });
      btns.push({o:o,b:b});g.appendChild(b);
    });
    q.appendChild(g);
    if(multi&&p.otro){

      otro.addEventListener('input',function(){S.r[p.id+'_otro']=otro.value;onChange()});q.appendChild(otro);
    }

  }

function nav(next,back){

  if(next)a.appendChild(next);

}
function dibuja(sube){
  var app=$('app');app.textContent='';

    if(modoApp){
      var det=h('details');det.id='alt-wa';det.appendChild(h('summary',null,'WhatsApp'));
      var ac3=h('div','acts');ac3.style.marginTop='4px';ac3.appendChild(cp);ac3.appendChild(wa);det.appendChild(ac3);app.appendChild(det);
    }
    var ba=h('button','btn quiet small','Atrás');ba.type='button';ba.addEventListener('click',function(){S.paso--;save();dibuja(true)});
    var ac2=h('div','acts');ac2.appendChild(ba);app.appendChild(ac2);
    if(sube){t2.focus({preventScroll:true});t2.scrollIntoView({block:'start'})}
  }
}
function arrancarApp(){
  if(!token)return;
  pasarAModoApp(true);marca(null);
  rpc('cli_cargar',{p_token:token}).then(function(info){
    if(!info){ /* enlace que ya no vale */
      pasarAModoApp(false);try{localStorage.removeItem(TKEY)}catch(e){}token=null;
      var b=$('estado-envio');b.textContent='Este enlace ya no vale.';b.hidden=false;dibuja(false);return;
    }
    primerNombre=(info.nombre||'').split(' ')[0]||'';
    var r=info.respuestas&&info.respuestas[TIPO];
    var vacioLocal=Object.keys(S.r).filter(function(k){return k!=='nombre'&&(S.r[k]||'').length!==0}).length===0;
    if(r&&r.datos&&vacioLocal){S.r=r.datos;S.paso=PASOS.length;save()}
    if(!(S.r.nombre||'').trim()&&primerNombre){S.r.nombre=primerNombre;save()}
    marca(r&&r.enviado?r.enviado:null);
    dibuja(false);
  },function(){ /* sin conexión: se puede seguir rellenando y enviar después */ dibuja(false) });
}
dibuja(false);
arrancarApp();
})();
</script>
